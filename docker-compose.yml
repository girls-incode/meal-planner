services:
  postgres:
    image: postgres:16-alpine
    container_name: meal-planner-db
    environment:
      POSTGRES_DB: meal_planner_development
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
      args:
        RUBY_VERSION: "3.3.8"
    container_name: meal-planner-backend
    environment:
      RAILS_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/meal_planner_development
      RAILS_LOG_TO_STDOUT: "true"
      FRONTEND_ORIGIN: http://localhost:5173
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/rails
    # Create database and run migrations on startup, then start Rails server
    command: >
      sh -c "rm -f tmp/pids/server.pid &&
             bundle exec rails db:create &&
             bundle exec rails db:migrate &&
             bundle exec rails db:seed &&
             bundle exec rails server -b 0.0.0.0 -p 3000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: meal-planner-frontend
    environment:
      VITE_API_BASE_URL: http://localhost:3000
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    # Vite dev server with HMR enabled for hot-module reloading

volumes:
  postgres_data:
