server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vite fingerprints compiled assets, so they are safe to cache indefinitely.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # HTML must be revalidated so a deployment can update the application shell.
    location = /index.html {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    # Let React Router resolve client-side routes such as /recipes/:id.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
